name: prices

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run price fetch (cloud IP passes warframe.market)
        run: |
          mkdir -p sites/data
          python3 -u tools/fetch_prices.py
          ls -la sites/data/

      - name: Mirror prices into site repo + trigger deploy
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, urllib.error, urllib.request
          tok = os.environ['SITE_TOKEN']
          def api(m, p, d=None):
              b = json.dumps(d).encode() if d is not None else None
              r = urllib.request.Request('https://api.github.com' + p, data=b, method=m)
              r.add_header('Authorization', 'Bearer ' + tok)
              r.add_header('User-Agent', 'wfcn')
              r.add_header('Accept', 'application/vnd.github+json')
              if b: r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r, timeout=120) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else {'__ok': True}
              except urllib.error.HTTPError as e:
                  return {'__err': e.code, '__body': e.read()[:160].decode('utf-8', 'ignore')}
          stamp = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
          for name in ('prices.js', 'orders.js'):
              local = os.path.join('sites', 'data', name)
              if not os.path.exists(local):
                  print('missing', name); continue
              body = open(local, 'rb').read()
              remote = 'sites/data/' + name
              cur = api('GET', '/repos/kihjdhsd/warframe-cn/contents/' + remote)
              pl = {'message': 'prices: %s (%s)' % (stamp, name),
                    'content': base64.b64encode(body).decode(), 'branch': 'main'}
              if isinstance(cur, dict) and cur.get('sha'): pl['sha'] = cur['sha']
              res = api('PUT', '/repos/kihjdhsd/warframe-cn/contents/' + remote, pl)
              print(name, '->', 'ok' if 'content' in res else res)
          d = api('POST', '/repos/kihjdhsd/warframe-cn/actions/workflows/deploy.yml/dispatches', {'ref': 'main'})
          print('dispatch deploy:', 'ok' if '__err' not in d else d)
          PY
