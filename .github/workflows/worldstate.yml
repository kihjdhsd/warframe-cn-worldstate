      - name: Fetch world state + bounties
        run: |
          for i in 1 2 3; do
            if curl -sS --max-time 45 --retry 2 --retry-delay 3 -H 'User-Agent: warframe-cn-site' \
                 'https://api.warframestat.us/pc?language=zh' -o raw.json && [ -s raw.json ]; then
              echo "got raw.json ($(wc -c < raw.json) bytes)"; break
            fi
            echo "attempt $i failed, retrying..."; sleep 8
          done
          [ -s raw.json ] || { echo "upstream unavailable, keeping previous data"; exit 0; }
          python3 - <<'PY'
          import json, datetime, re
          w = json.load(open('raw.json', encoding='utf-8'))

          # 官方英中对照表（由 gen_zh_map.py 生成，随仓库发布）
          try:
              ZM = json.load(open('zh-map.json', encoding='utf-8'))
          except Exception:
              ZM = {'rw': {}, 'bn': {}, 'names': {}, 'part': {}, 'tier': {}}
          RW, BN, NAMES, PART, TIER = ZM['rw'], ZM['bn'], ZM['names'], ZM['part'], ZM['tier']
          NOSPACE = {}
          for k, v in RW.items():
              NOSPACE[k.replace(' ', '').replace('-', '').lower()] = v
          BN_L = {k.lower(): v for k, v in BN.items()}

          def tr(name):
              if not name: return name
              if name in RW: return RW[name]
              if name in BN: return BN[name]
              base, suffix = name, ''
              m = re.match(r'^(.*?)\s*\((Endless|Steel Path)\)\s*$', name)   # 无尽/钢铁之路变体
              if m:
                  base, suffix = m.group(1).strip(), m.group(2)
              for cand in (base, name):
                  if cand in RW: return RW[cand] + ('（无尽）' if suffix == 'Endless' else '')
                  if cand in BN: return BN[cand] + ('（无尽）' if suffix == 'Endless' else '')
                  if cand.lower() in BN_L: return BN_L[cand.lower()] + ('（无尽）' if suffix == 'Endless' else '')
                  key = cand.replace(' ', '').replace('-', '').lower()
                  if key in NOSPACE: return NOSPACE[key]
              m = re.match(r'^(.+?)\s+(.+?)\s+Blueprint$', base)
              if m and m.group(1) in NAMES and m.group(2) in PART:
                  return '%s %s' % (NAMES[m.group(1)], PART[m.group(2)])
              m = re.match(r'^(\w+)\s+(\w+)\s+Relic$', base)
              if m and m.group(1) in TIER:
                  return '%s %s 遗物' % (TIER[m.group(1)], m.group(2))
              return name

          def tr_reward(s):
              """奖励串带数量前缀，如 '200X Plastids' / '1,500 Credits Cache' → '200 生物质'"""
              m = re.match(r'^([\d,]+)\s*[xX×]?\s+(.+)$', s or '')
              num, item = ('', s or '')
              if m:
                  num, item = m.group(1), m.group(2).strip()
              zh = tr(item)
              if zh == item:
                  return s
              return ('%s %s' % (num, zh)) if num else zh

          def human(iso):
              if not iso: return ''
              try: t = datetime.datetime.fromisoformat(iso.replace('Z', '+00:00'))
              except Exception: return ''
              d = (t - datetime.datetime.now(datetime.timezone.utc)).total_seconds()
              if d <= 0: return '即将结束'
              m = int(d // 60); h = m // 60; dd = h // 24
              if dd > 0: return '%d 天 %d 小时' % (dd, h % 24)
              if h > 0:  return '%d 小时 %d 分' % (h, m % 60)
              return '%d 分钟' % m

          cet = w.get('cetusCycle'); val = w.get('vallisCycle'); cam = w.get('cambionCycle')
          cyc = []
          if cet: cyc.append({'k': '地球', 's': '白天' if cet.get('isDay') else '夜晚', 'left': human(cet.get('expiry'))})
          if val: cyc.append({'k': '金星', 's': '温暖' if val.get('isWarm') else '寒冷', 'left': human(val.get('expiry'))})
          if cam: cyc.append({'k': '火卫二', 's': '法丝' if cam.get('active') == 'fass' else '沃姆', 'left': human(cam.get('expiry'))})

          SY = {'Ostron': '地球 · 夜灵平野', 'Ostrons': '地球 · 夜灵平野',
                'Solaris United': '金星 · 奥布山谷', 'Entrati': '火卫二 · 魔胎之境',
                'Cavia': '解剖圣所', 'The Hex': '霍夫尼亚', 'Hex': '霍夫尼亚',
                'Holdfasts': '扎里曼号', 'Necraloid': '殁圣械灵', 'Ventkids': '通风小子',
                'Conclave': '武形秘仪', 'Cephalon Suda': '中枢苏达'}
          bounties = []
          for sm in (w.get('syndicateMissions') or []):
              syn = sm.get('syndicate') or sm.get('syndicateKey') or ''
              jobs = []
              for j in (sm.get('jobs') or []):
                  lv = j.get('enemyLevels') or []
                  pool = []
                  for r in (j.get('rewardPool') or [])[:10]:
                      rz = tr_reward(r)
                      if rz not in pool:
                          pool.append(rz)
                  jobs.append({
                      't': tr(j.get('type') or j.get('jobType') or ''),
                      'lv': ('%s-%s' % (lv[0], lv[1])) if len(lv) == 2 else '',
                      'rp': pool})
              if jobs:
                  bounties.append({'syn': SY.get(syn, syn), 'left': human(sm.get('expiry')), 'jobs': jobs[:6]})

          s = w.get('sortie') or {}
          vt = w.get('voidTrader')
          # ---- 扩展：扎里曼 / 双衍王境 周期 ----
          z = w.get('zarimanCycle')
          if z: cyc.append({'k': '扎里曼', 's': '科珀斯' if z.get('isCorpus') else '已净化', 'left': human(z.get('expiry'))})
          dv = w.get('duviriCycle')
          if dv: cyc.append({'k': '双衍王境', 's': str(dv.get('state') or ''), 'left': human(dv.get('expiry'))})

          def srows(items, fa, fb, fc=None, limit=8):
              out = []
              for x in (items or [])[:limit]:
                  if not isinstance(x, dict): continue
                  out.append({'a': tr(str(fa(x) or ''))[:34], 'b': tr(str(fb(x) or ''))[:46],
                              'c': human(fc(x)) if fc else ''})
              return out

          nw = w.get('nightwave') or {}
          arb = w.get('arbitration') or {}
          data = {
            'cycles': cyc,
            'trader': ({'k': '已抵达' if vt.get('active') else '前往中', 'n': vt.get('location', ''), 'left': human(vt.get('activation'))} if vt else None),
            'sortie': ({'k': s.get('boss', ''), 'n': s.get('faction', ''), 'left': human(s.get('expiry')),
                        'rows': [{'a': v.get('missionType', ''), 'b': v.get('node', '')} for v in (s.get('variants') or [])]} if s else None),
            'fissures': [{'a': (f.get('tier', '') + ' ' + f.get('missionType', '')), 'b': f.get('node', ''), 'c': human(f.get('expiry'))} for f in (w.get('fissures') or [])[:8]],
            'bounties': bounties,
            # ---- 扩展板块（wf.wiki 那种"什么都有"）----
            'nightwave': ({'season': nw.get('season'), 'rows': [
                {'a': tr(str(c.get('title') or ''))[:30], 'b': tr(str(c.get('desc') or ''))[:46],
                 'c': ('%s 声望' % c.get('reputation')) if c.get('reputation') else ''}
                for c in (nw.get('activeChallenges') or [])[:10]]} if nw.get('activeChallenges') else None),
            'invasions': srows([i for i in (w.get('invasions') or []) if not i.get('completed')],
                               lambda i: i.get('node'),
                               lambda i: '%s %d%% ／ %s %d%%' % (
                                   (i.get('attacker') or {}).get('faction', ''), round(i.get('completion') or 0),
                                   (i.get('defender') or {}).get('faction', ''), round(100 - (i.get('completion') or 0))),
                               lambda i: i.get('expiry'), 8),
            'alerts': srows(w.get('alerts'), lambda a: (a.get('mission') or {}).get('node'),
                            lambda a: (a.get('mission') or {}).get('type'), lambda a: a.get('expiry'), 6),
            'arbitration': ({'k': arb.get('node', ''), 'n': arb.get('type', ''), 'left': human(arb.get('expiry'))} if arb else None),
            'events': srows(w.get('events'), lambda e: str(e.get('description') or '').replace('\n', ' '),
                            lambda e: e.get('node') or '', lambda e: e.get('expiry'), 5),
            'deals': srows(w.get('dailyDeals'), lambda d: d.get('item'),
                           lambda d: '-%s%%' % (d.get('discount') or 0), lambda d: d.get('expiry'), 5),
            'invInventory': srows(vt.get('inventory') if vt else None, lambda i: i.get('item'),
                                  lambda i: '%s 杜卡德 + %s 星币' % (i.get('ducats', 0), i.get('credits', 0)), None, 12),
            'steelPath': ({'a': ((w.get('steelPath') or {}).get('currentReward') or {}).get('name'),
                           'c': human((w.get('steelPath') or {}).get('expiry'))}
                          if (w.get('steelPath') or {}).get('currentReward') else None),
            'news': srows(w.get('news'), lambda n: str(n.get('message') or '').replace('\n', ' '),
                          lambda n: '', lambda n: n.get('date'), 5),
            'updated': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
          }
          json.dump(data, open('worldstate.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          json.dump({'syndicateMissions_sample': (w.get('syndicateMissions') or [])[:2]},
                    open('debug.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print('cycles=%d fissures=%d bounties=%d' % (len(cyc), len(data['fissures']), len(bounties)))
          PY
